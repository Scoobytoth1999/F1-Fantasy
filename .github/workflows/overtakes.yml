name: Build overtake heat map data

# Manual only: Actions tab -> "Build overtake heat map data" -> Run workflow.
# Writes overtakes-cota.json; does not touch index.html.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Race years (space-separated)"
        default: "2022 2023 2024 2025"

permissions:
  contents: write

concurrency:
  group: overtakes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FastF1
        run: pip install "fastf1>=3.8,<4" scipy

      - name: Cache F1 timing data
        uses: actions/cache@v4
        with:
          path: .fastf1-cache
          key: fastf1-cota-${{ inputs.years }}

      - name: Derive overtakes per corner
        run: |
          status=0
          python -u scripts/overtakes.py --years ${{ inputs.years }} --out overtakes-cota.json > raw.log 2>&1 || status=$?
          { grep -v -E " INFO | DEBUG " raw.log || true; } | tail -c 60000 > overtakes-run.log
          echo "exit status: $status" >> overtakes-run.log
          cat overtakes-run.log
          # surface the result as an annotation (readable via the checks API)
          msg=$(tail -c 3500 overtakes-run.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=Overtake summary::$msg"
          exit $status

      - name: Commit data and run log
        if: always()
        run: |
          set +e
          {
            git config user.name  "results-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add overtakes-run.log
            if [ -f overtakes-cota.json ]; then git add overtakes-cota.json; fi
            if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
            git commit -m "Update COTA overtake data" &&
            git pull --rebase origin main &&
            git push origin HEAD:main
          } > commit.log 2>&1
          rc=$?
          cat commit.log
          if [ $rc -ne 0 ]; then
            echo "::error title=Commit failed::$(tail -c 1500 commit.log | awk 'BEGIN{ORS="%0A"}{print}')"
          fi
          exit $rc
