name: Build overtake heat map data

# Manual only: Actions tab -> "Build overtake heat map data" -> Run workflow.
# Writes overtakes-cota.json; does not touch index.html.
# Each race year runs on its own runner (F1's timing server throttles a single
# runner after one full race download), then a final job merges and commits.
on:
  workflow_dispatch:
    inputs:
      years:
        description: "Race years as a JSON list"
        default: "[2022, 2023, 2024, 2025]"

permissions:
  contents: write

concurrency:
  group: overtakes
  cancel-in-progress: false

jobs:
  year:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        year: ${{ fromJSON(inputs.years) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FastF1
        run: pip install "fastf1>=3.8,<4" scipy

      - name: Cache F1 timing data
        uses: actions/cache@v4
        with:
          path: .fastf1-cache
          key: fastf1-cota-${{ matrix.year }}

      - name: Probe F1 timing archive
        run: |
          for u in "https://livetiming.formula1.com/static/${{ matrix.year }}/Index.json" "https://api.openf1.org/v1/sessions?year=${{ matrix.year }}&session_name=Race&location=Austin"; do
            code=$(curl -s -o probe.txt -w "%{http_code}" -A "Mozilla/5.0" "$u"); echo "$u -> $code $(head -c 200 probe.txt)"
            echo "::notice title=probe ${{ matrix.year }}::$u -> $code $(head -c 300 probe.txt | tr -d '\n%')"
          done

      - name: Analyse ${{ matrix.year }}
        run: |
          status=0
          python -u scripts/overtakes.py --years ${{ matrix.year }} --part part-${{ matrix.year }}.json > raw.log 2>&1 || status=$?
          grep -v -E " DEBUG " raw.log | tail -c 3000 > short.log || true
          cat raw.log | grep -v " DEBUG " | tail -200
          if [ $status -ne 0 ]; then
            echo "::error title=${{ matrix.year }} failed::$(sed 's/%/%25/g' short.log | awk 'BEGIN{ORS="%0A"}{print}')"
          fi
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.year }}
          path: part-${{ matrix.year }}.json

  combine:
    needs: year
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true

      - name: Combine years
        run: |
          python -c "import numpy" 2>/dev/null || pip install numpy
          ls part-*.json
          python scripts/overtakes.py --combine part-*.json --out overtakes-cota.json | tee overtakes-run.log
          msg=$(sed 's/%/%25/g' overtakes-run.log | awk 'BEGIN{ORS="%0A"}{print}')
          echo "::notice title=Overtake summary::$msg"

      - name: Commit data and run log
        run: |
          git config user.name  "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overtakes-cota.json overtakes-run.log
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Update COTA overtake data"
          git pull --rebase origin main
          git push origin HEAD:main
