name: Build overtake data

# Derives on-track passes for every Grand Prix since 2023 from OpenF1 and
# commits them for the app's passing maps and F1-average comparison.
#  - Runs itself every Monday (picks up the weekend's race; already-analysed
#    races are skipped, so a normal week is one race).
#  - Manual: Actions tab -> "Build overtake data" -> Run workflow.
# Writes overtakes/races/*.json, overtakes-<circuit>.json, overtakes-f1.json.
# Never touches index.html.
on:
  schedule:
    - cron: "40 13 * * 1"     # Monday 13:40 UTC (09:40 Detroit)
  workflow_dispatch:
    inputs:
      years:
        description: "Limit to these years, space-separated (blank = 2023 to now)"
        default: ""
      force:
        description: "Re-analyse races that already have data"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: overtakes
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      todo: ${{ steps.plan.outputs.todo }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: List races still to analyse
        id: plan
        run: |
          args=""
          [ -n "${{ inputs.years }}" ] && args="--years ${{ inputs.years }}"
          [ "${{ inputs.force }}" = "true" ] && args="$args --force"
          todo=$(python scripts/overtakes.py --plan $args)
          count=$(echo "$todo" | python -c "import json,sys;print(len(json.load(sys.stdin)))")
          echo "todo=$todo"   >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "::notice title=Races to analyse::$count"
          echo "$todo" | python -c "import json,sys;[print(r['year'],r['meeting']) for r in json.load(sys.stdin)]"

  race:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5              # stay polite to OpenF1's free API
      matrix:
        item: ${{ fromJSON(needs.plan.outputs.todo) }}
    name: ${{ matrix.item.year }} ${{ matrix.item.meeting }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - name: Analyse
        run: |
          status=0
          python -u scripts/overtakes.py --race '${{ toJSON(matrix.item) }}' > run.log 2>&1 || status=$?
          tail -c 4000 run.log
          if [ $status -ne 0 ]; then
            echo "::error title=${{ matrix.item.year }} ${{ matrix.item.meeting }}::$(tail -c 1500 run.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
          fi
          exit $status
      - uses: actions/upload-artifact@v4
        with:
          name: race-${{ matrix.item.key }}
          path: overtakes/races/*.json

  build:
    needs: [plan, race]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - uses: actions/download-artifact@v4
        with:
          pattern: race-*
          path: overtakes/races
          merge-multiple: true
      - name: Merge
        run: |
          python scripts/overtakes.py --build | tee overtakes-run.log
          echo "::notice title=Overtake summary::$(sed 's/%/%25/g' overtakes-run.log | awk 'BEGIN{ORS="%0A"}{print}')"
      - name: Commit
        run: |
          git config user.name  "results-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add overtakes/races overtakes-*.json overtakes-run.log
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Update overtake data"
          git pull --rebase origin main
          git push origin HEAD:main
