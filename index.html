    :root {
      /* ── Base light theme (constant across palettes) ── */

      --text:#1A1A1A; --subtext:#55524D; --dim:#5F5B54; --muted:#8A857C;

      /* ── Semantic colours (fixed, so status always reads the same) ── */
      --green:#0F7B43; --gold:#8A6A00; --orange:#B24A00; --teal:#00706B; --danger:#C0182B;

      /* ── Team palette (overwritten by the palette classes below) ── */
      --accent:#df102e; --accent2:#7f7900;

    [data-team="ferrari"] {

    }

    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      background:var(--bg); color:var(--text);
      font-family:'DM Sans',sans-serif; min-height:100vh; overflow-x:hidden;
      transition:background .4s ease;
    }
    /* Soft team-tinted wash at the top of the page — this is the rotating background */
    body::after {
      content:''; position:fixed; top:-160px; left:-100px; width:620px; height:480px;
      background:radial-gradient(ellipse at center,
        color-mix(in srgb, var(--head1) 22%, transparent) 0%, transparent 70%);
      pointer-events:none; z-index:0; transition:background .4s ease;
    }
    #root { position:relative; z-index:1; }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:var(--bg); }
    ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:2px; }
    select option { background:#fff; color:var(--text); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);} }
    @keyframes pulse  { 0%,100%{opacity:1;}50%{opacity:.4;} }
    @keyframes spin   { to{transform:rotate(360deg);} }
    .anim { animation:fadeUp .28s ease forwards; }
    .rg { color:#9A7B00; }
    .rs { color:#6E7276; }
    .rb { color:#8A5A2B; }
    .bp { transition:opacity .15s,transform .1s; cursor:pointer; }
    .bp:hover  { opacity:.85; transform:translateY(-1px); }
    .bp:active { transform:translateY(0); }
    .menu-btn {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:4px; width:38px; height:38px; border-radius:10px;
      background:var(--field); border:1px solid var(--border); cursor:pointer;
      transition:background .15s, border-color .15s;
    }
    .menu-btn:hover { background:var(--surface2); }
    .menu-btn span {
      display:block; width:16px; height:2px; border-radius:2px;
      background:var(--text); transition:transform .2s ease, opacity .2s ease;
    }
    .menu-btn.open span:nth-child(1) { transform:translateY(6px) rotate(45deg); }
    .menu-btn.open span:nth-child(2) { opacity:0; }
    .menu-btn.open span:nth-child(3) { transform:translateY(-6px) rotate(-45deg); }
    .menu-overlay { position:fixed; inset:0; z-index:150; background:transparent; }
    .menu-panel {
      position:absolute; top:calc(100% + 8px); right:0; z-index:200;
      background:var(--card); border:1px solid var(--border); border-radius:14px;
      box-shadow:0 12px 32px rgba(0,0,0,.16); padding:6px; min-width:200px;
      animation:fadeUp .16s ease;
    }
    .menu-item {
      display:flex; align-items:center; gap:10px; width:100%;
      padding:10px 12px; border-radius:9px; border:none; background:none;
      cursor:pointer; text-align:left; font-family:'DM Sans',sans-serif;
      font-size:14px; font-weight:500; color:var(--text); transition:background .12s;
    }
    .menu-item:hover { background:var(--surface2); }
    .menu-item.active {

    const { useState, useEffect, useCallback, useRef } = React;

    const GP_PTS  = [25,18,15,12,10,8,6,4,2,1];

    // Pick a random palette, never the same one twice in a row.
    function nextTeam(currentId) {
      const pool = PALETTES.filter(p => p.id !== currentId);

    // Lighten (amt > 0) or darken (amt < 0) a hex colour. Used to give a team's
    // third-and-beyond driver a shade that still reads as that team.
    function shade(hex, amt) {
      const n = parseInt(String(hex).replace("#",""), 16);
      if (Number.isNaN(n)) return hex;
      return "#" + [(n>>16)&255, (n>>8)&255, n&255]
        .map(v => Math.max(0, Math.min(255, Math.round(amt >= 0 ? v + (255-v)*amt : v*(1+amt)))))
        .map(v => v.toString(16).padStart(2,"0")).join("");
    }
    const FALLBACK_TEAM = { c1:"#8892A0", c2:"#5A6270" };

    // ── Live roster registries ──────────────────────────────────────────────────
    // These four are what the rest of the app actually reads. They are rebuilt from
    // F1_TEAMS_BASE plus league state (customDrivers / inactiveDrivers) and are

    //
    //   ROSTER_2026 — every driver the app knows about, including injured ones.
    //                 Used for results entry, name matching and the research chart,
    //                 so history never breaks when someone leaves the grid.
    //   DRIVERS     — the pickable list: ROSTER_2026 minus anyone marked inactive.
    const F1_TEAMS_2026 = [];
    const DRIVER_META   = {};
    const ROSTER_2026   = [];
    const DRIVERS       = [];

    let _rosterKey = null;

    function rebuildRoster(customDrivers, inactiveDrivers) {
      const customs  = Array.isArray(customDrivers)   ? customDrivers   : [];
      const inactive = Array.isArray(inactiveDrivers) ? inactiveDrivers : [];
      // Called on every App render, so bail early when nothing changed.
      const key = JSON.stringify([customs, inactive]);
      if (key === _rosterKey) return;
      _rosterKey = key;

      const teams  = F1_TEAMS_BASE.map(t => ({ ...t, drivers:[...t.drivers] }));
      const byName = {};
      teams.forEach(t => { byName[t.name] = t; });

      customs.forEach(cd => {
        if (!cd || !cd.name) return;
        const teamName = cd.team || "Independent";
        let t = byName[teamName];
        if (!t) {
          // Unknown constructor (hand-edited data, or a future team). Give it a
          // neutral palette rather than dropping the driver on the floor.
          t = { name:teamName, ...FALLBACK_TEAM, drivers:[], isCustomTeam:true };
          byName[teamName] = t;
          teams.push(t);
        }
        if (!t.drivers.includes(cd.name)) t.drivers.push(cd.name);
      });

      const customNames = new Set(customs.map(c => c && c.name).filter(Boolean));

      F1_TEAMS_2026.length = 0;
      F1_TEAMS_2026.push(...teams);

      Object.keys(DRIVER_META).forEach(k => delete DRIVER_META[k]);
      ROSTER_2026.length = 0;
      teams.forEach(t => t.drivers.forEach((d,i) => {
        DRIVER_META[d] = {
          team:   t.name,
          color:  i === 0 ? t.c1 : i === 1 ? t.c2 : shade(i % 2 === 0 ? t.c1 : t.c2, 0.42),
          custom: customNames.has(d),
        };
        ROSTER_2026.push(d);
      }));

      const out = new Set(inactive);
      DRIVERS.length = 0;
      DRIVERS.push(...ROSTER_2026.filter(d => !out.has(d)));
    }
    rebuildRoster([], []);   // base grid until Firestore data arrives

    // Loose name matching so pasted results don't have to be typed exactly.
    function normName(s) {
      return (s||"")
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
    }
    function matchDriver(raw) {
      const cleaned = (raw||"").replace(/^\s*\d+\s*[.)-]?\s*/, "");
      const n = normName(cleaned);
      if (!n) return null;
      let hit = ROSTER_2026.find(d => normName(d) === n);
      if (hit) return hit;
      hit = ROSTER_2026.find(d => normName(d).split(" ").slice(-1)[0] === n);
      if (hit) return hit;
      hit = ROSTER_2026.filter(d => normName(d).includes(n));
      return hit.length === 1 ? hit[0] : null;
    }

    // DATA_OK is true ONLY when we have confirmed real state from Firestore.
    // Every write is gated on it. This exists because a failed load that silently
    // falls back to DEFAULT_DATA must never be able to save itself back as truth —
    // that overwrites a real league with hardcoded defaults.
    let DATA_OK = false;

    async function loadData() {
      if (!db) { DATA_OK = false; return DEFAULT_DATA; }
      let doc;
      try {
        // READ ONLY. No write may share this try block: a failed write must not
        // be indistinguishable from a failed read.
        doc = await db.collection("f1fantasy").doc("data").get();
      } catch(e) {
        console.error("Firestore READ failed — running read-only on defaults.", e);
        DATA_OK = false;
        return DEFAULT_DATA;
      }
      if (doc.exists) {
        DATA_OK = true;
        return doc.data();
      }
      // Document genuinely absent. Deliberately do NOT auto-create it: that is how
      // an empty league silently replaces a real one. Requires explicit admin action.
      console.warn("No league document found. Read-only until an admin restores or initialises one.");
      DATA_OK = false;
      return DEFAULT_DATA;
    }

    async function saveData(data) {
      if (!db) return;

      } catch(e) {
        console.error("Firestore save error:", e);
      }

    // The ONLY path that may write without DATA_OK. Used by admin restore/import,

    async function forceWriteData(data) {

    // ── Helpers ─────────────────────────────────────────────────────────────────

    function total(player, races) {
      return races.reduce((sum, r) => {
        if (r.noLeague) return sum;
        // Count completed races fully, plus sprint-only points from in-progress sprint weekends
        if (r.status === "completed") {
          const p  = r.points?.[player.id];
          const p2 = r.points2?.[player.id];
          return sum + (p ? (p.s||0)+(p.r||0) : 0) + (p2 ? (p2.s||0)+(p2.r||0) : 0);
        }
        if (r._sprintSaved) {
          const p  = r.points?.[player.id];
          const p2 = r.points2?.[player.id];
          return sum + (p ? (p.s||0) : 0) + (p2 ? (p2.s||0) : 0); // sprint points only until GP finalizes
        }
        return sum;
      }, 0);
    }
    function standings(players, races) {
      return [...players].map(p => ({...p, pts: total(p, races)})).sort((a,b) => b.pts - a.pts);
    }
    // Total from COMPLETED races only — used for pick order so in-progress sprint points don't affect it
    function completedTotal(player, races) {
      return races.reduce((sum, r) => {
        if (r.status !== "completed" || r.noLeague) return sum;
        const p  = r.points?.[player.id];
        const p2 = r.points2?.[player.id];
        return sum + (p ? (p.s||0)+(p.r||0) : 0) + (p2 ? (p2.s||0)+(p2.r||0) : 0);
      }, 0);
    }
    function lastRacePts(player, races) {
      const last = [...races].reverse().find(r => r.status === "completed" && !r.noLeague);
      if (!last) return 0;
      const p  = last.points?.[player.id];
      const p2 = last.points2?.[player.id];
      return (p ? (p.s||0)+(p.r||0) : 0) + (p2 ? (p2.s||0)+(p2.r||0) : 0);
    }

    // ── Second Driver Pick helpers ──────────────────────────────────────────────

    // Race day (the day picks lock): GP date, or the day before for sprint weekends
    // (sprint race runs Saturday, one driver covers both sessions, so lock before it).
    function raceLockDay(race) {
      const d = new Date(race.date + "T00:00:00");
      if (race.hasSprint) d.setDate(d.getDate() - 1);
      return d;
    }
    // All picks (1st and 2nd) lock at 12:01 AM on race day.
    function raceLockTime(race) {
      const d = raceLockDay(race);
      d.setHours(0, 1, 0, 0);
      return d;
    }
    // Second-pick window opens whichever comes first: the scheduled free-for-all time,
    // or the moment all 6 first picks are locked in (race._allPickedAt).
    function secondPickStart(race) {
      const scheduled = freeForAllTime(race);
      if (race._allPickedAt) {
        const early = new Date(race._allPickedAt);
        return early < scheduled ? early : scheduled;
      }
      return scheduled;
    }
    // 6 hours after the second-pick window opens, everyone (not just bottom 3) can pick.
    function secondPickEveryoneTime(race) {
      const d = new Date(secondPickStart(race));
      d.setHours(d.getHours() + 6);
      return d;
    }
    // Bottom 3 in current season standings get first access to the 2nd pick.
    // If there's a tie right at the 3rd/4th boundary, both tied players move into
    // the "everyone" group instead of either getting the early slot.
    //
    // The stagger only kicks in from the THIRD race of the season onward. For the
    // first two races everyone picks their 2nd driver at the same time, because
    // standings are too bunched up early on (several players tied on zero would
    // trip the boundary-tie rule and collapse the early group to nobody).
    function staggerActive(races) {
      const completedLeague = races.filter(r => r.status === "completed" && !r.noLeague).length;
      return completedLeague >= 2;
    }
    function secondPickGroups(players, races) {
      if (!staggerActive(races)) return { bottomIds: new Set(), staggered: false };
      const asc = [...players].map(p => ({ ...p, pts: total(p, races) })).sort((a,b) => a.pts - b.pts);
      const boundaryPts = asc[3] ? asc[3].pts : null;
      const bottomIds = new Set(
        asc.slice(0, 3).filter(p => boundaryPts === null || p.pts !== boundaryPts).map(p => p.id)
      );
      return { bottomIds, staggered: true };
    }
    function pickOrder(players, races) {
      // Sort order: worst last race first, then worst overall, then work back race by race
      const completedRaces = [...races]
        .filter(r => r.status === "completed" && !r.noLeague)
        .reverse(); // most recent first

      return [...players]
        .map(p => ({
          ...p,
          _totalPts: completedTotal(p, races),
          _history: completedRaces.map(r => {
            // Must match lastRacePts/completedTotal and count BOTH drivers. Using
            // first-driver points only made the primary sort ("worst last race
            // picks first") disagree with the standings players actually see.
            const pts  = r.points?.[p.id];
            const pts2 = r.points2?.[p.id];
            return (pts ? (pts.s||0)+(pts.r||0) : 0) + (pts2 ? (pts2.s||0)+(pts2.r||0) : 0);
          }),
        }))
        .sort((a, b) => {
          // 1. Last race points (worst first)
          const aLast = a._history[0] ?? 0;
          const bLast = b._history[0] ?? 0;
          if (aLast !== bLast) return aLast - bLast;

          // 2. Overall standings (worst first)
          if (a._totalPts !== b._totalPts) return a._totalPts - b._totalPts;

          // 3. Keep going back race by race until tie breaks
          for (let i = 1; i < Math.max(a._history.length, b._history.length); i++) {
            const ai = a._history[i] ?? 0;
            const bi = b._history[i] ?? 0;
            if (ai !== bi) return ai - bi;
          }
          return 0; // truly equal
        });
    }
    function daysUntil(d) {
      return Math.ceil((new Date(d) - new Date()) / 86400000);
    }
    function hoursUntil(d) {
      return (new Date(d) - new Date()) / 3600000;

    // keyDate: Friday for sprint weekends (qualifying day), Saturday for normal
    function keyDate(race) {
      if (!race.hasSprint) return race.date;
      const d = new Date(race.date);
      d.setDate(d.getDate() - 2); // Sprint qualifying is Friday (GP Sunday - 2 days)
      return d.toISOString().slice(0, 10);
    }
    // Free-for-all opens 10am the day BEFORE qualifying.
    // Normal weekend: qualifying Sat -> opens Friday 10am (GP date - 2)
    // Sprint weekend: sprint quali Fri -> opens Thursday 10am (GP date - 3)
    function freeForAllTime(race) {
      const d = new Date(race.date + "T00:00:00");
      d.setDate(d.getDate() - (race.hasSprint ? 3 : 2));
      d.setHours(10, 0, 0, 0);
      return d;
    }

                  <div style={{ display:"flex", gap:7 }}>
                    <input
                      value={replyText}
                      onChange={e => setReplyText(e.target.value)}

                      placeholder={replyWho ? "Write a reply..." : "Pick who you are first"}
                      disabled={!replyWho}
                      style={{ flex:1, background:"var(--field)", border:`1px solid ${C.border}`, borderRadius:9, color:"var(--text)", padding:"8px 12px", fontSize:13, fontFamily:"DM Sans,sans-serif", opacity: replyWho ? 1 : .55 }}
                    />
                    <button className="bp" onClick={sendReply} disabled={replying || !replyWho || !replyText.trim()}
                      style={{ background:C.teal, color:"#fff", border:"none", borderRadius:9, padding:"8px 15px", fontFamily:"DM Sans,sans-serif", fontSize:11, fontWeight:700, letterSpacing:".1em", textTransform:"uppercase", cursor:"pointer", opacity:(replying || !replyWho || !replyText.trim()) ? .4 : 1, flexShrink:0 }}>

    }
    // ── Custom drivers ───────────────────────────────────────────────────────────
    // Reserve/stand-in drivers added mid-season. Stored on the league document as
    // data.customDrivers = [{ name, team, addedBy, addedAt }] so they survive
    // reloads, ride along in backups, and are visible to every player at once.

    // Tidy a typed name: collapse whitespace, capitalise each word. Keeps
    // "van Amersfoort"-style particles alone and leaves hyphenated names intact.
    const NAME_PARTICLES = new Set(["van","von","de","del","der","da","di","dos","la","le"]);
    function tidyName(raw) {
      return (raw||"").replace(/\s+/g," ").trim().split(" ").map((w,i) => {
        const lw = w.toLowerCase();
        if (i > 0 && NAME_PARTICLES.has(lw)) return lw;
        return w.split("-").map(p => p ? p.charAt(0).toUpperCase() + p.slice(1) : p).join("-");
      }).join(" ");
    }

    // Returns an error string, or "" when the name is safe to add.
    function validateNewDriver(name, team) {
      const clean = tidyName(name);
      if (clean.length < 3)            return "Enter the driver's full name.";
      if (!/[a-zA-Z]/.test(clean))     return "That doesn't look like a name.";
      if (clean.split(" ").length < 2) return "Use a first and last name so results matching works.";
      if (!team)                       return "Pick the team they're driving for.";
      const n   = normName(clean);
      const dup = ROSTER_2026.find(d => normName(d) === n);
      if (dup) return `${dup} is already on the grid.`;
      // Last-name collision: "Verstappen" vs "Max Verstappen" would make pasted
      // results ambiguous, and matchDriver() would silently pick neither.
      const last = n.split(" ").slice(-1)[0];
      const clash = ROSTER_2026.find(d => normName(d).split(" ").slice(-1)[0] === last);
      if (clash) return `Shares a surname with ${clash} — results matching can't tell them apart.`;
      return "";
    }

    // Inline "driver not listed?" form. Used in both pick sections.
    function AddDriverInline({ data, update, showToast, whoId, onAdded, accent=C.teal }) {
      const [open,   setOpen]   = useState(false);
      const [name,   setName]   = useState("");
      const [team,   setTeam]   = useState("");
      const [err,    setErr]    = useState("");
      const [saving, setSaving] = useState(false);

      async function add() {
        const clean = tidyName(name);
        const problem = validateNewDriver(clean, team);
        if (problem) { setErr(problem); return; }
        setSaving(true);
        const entry = {
          name: clean,
          team,
          addedBy: whoId || "unknown",
          addedAt: new Date().toISOString(),
        };
        await update({ ...data, customDrivers: [...(data.customDrivers||[]), entry] });
        setSaving(false);
        setOpen(false); setName(""); setTeam(""); setErr("");
        showToast(`${clean} added to the grid 🏎`);
        if (onAdded) onAdded(clean);
      }

      if (!open) return (
        <button className="bp" onClick={() => setOpen(true)}
          style={{ background:"none", border:"none", padding:0, marginTop:-6, marginBottom:12, cursor:"pointer",
            fontFamily:"DM Sans,sans-serif", fontSize:11.5, fontWeight:600, color:accent, textDecoration:"underline" }}>
          ＋ Driver not listed? Add a stand-in
        </button>
      );

      return (
        <div style={{ marginBottom:14, padding:"12px 13px", background:"var(--surface2)",
          border:`1px solid color-mix(in srgb, ${accent} 30%, transparent)`, borderRadius:10 }}>
          <div style={{ fontSize:11.5, color:C.dim, lineHeight:1.6, marginBottom:10 }}>
            For a reserve driver standing in for someone injured. They're added for
            <strong> everyone, permanently</strong> — so check the spelling against the entry list.
          </div>
          {err && <div style={{ color:C.danger, fontSize:12, marginBottom:9, fontWeight:600 }}>{err}</div>}
          <div style={{ marginBottom:9 }}>
            <Lbl>Driver Name</Lbl>
            <Inp value={name} onChange={e => { setName(e.target.value); setErr(""); }}
              placeholder="e.g. Ayumu Iwasa"
              onKeyDown={e => e.key === "Enter" && !saving && add()} />
          </div>
          <div style={{ marginBottom:12 }}>
            <Lbl>Driving For</Lbl>
            <Sel value={team} onChange={e => { setTeam(e.target.value); setErr(""); }}>
              <option value="">Select a team...</option>
              {F1_TEAMS_BASE.map(t => <option key={t.name} value={t.name}>{t.name}</option>)}
            </Sel>
          </div>
          <div style={{ display:"flex", gap:8 }}>
            <Btn variant="ghost" onClick={() => { setOpen(false); setErr(""); }}>Cancel</Btn>
            <Btn onClick={add} disabled={saving} style={{ background:accent, color:"#fff" }}>
              {saving ? "Adding..." : "Add Driver"}
            </Btn>
          </div>
        </div>
      );
    }

    // ── This Race ────────────────────────────────────────────────────────────────

    function RaceTab({ data, update, showToast }) {
      const next = data.races.find(r => r.status !== "completed");
      const [who, setWho]           = useState("");
      const [driver, setDriver]     = useState("");
      const [done, setDone]         = useState(false);
      const [sending, setSending]   = useState(false);
      const [confirming, setConfirming] = useState(false);
      const [err, setErr]           = useState("");

      const [who2, setWho2]         = useState("");
      const [driver2, setDriver2]   = useState("");
      const [done2, setDone2]       = useState(false);
      const [sending2, setSending2] = useState(false);
      const [confirming2, setConfirming2] = useState(false);
      const [err2, setErr2]         = useState("");

      if (!next) return (
        <div className="anim">
          <Card style={{ textAlign:"center", padding:"50px 20px" }}>
            <div style={{ fontSize:46, marginBottom:12 }}>🏁</div>
            <div style={{ fontFamily:"Syne,sans-serif", fontSize:18, marginBottom:8 }}>No Upcoming Race</div>
            <div style={{ fontSize:13, color:C.dim }}>Admin needs to open picks for the next race.</div>
          </Card>
        </div>
      );

      const deadline    = keyDate(next);
      const days        = daysUntil(deadline);
      const hours       = hoursUntil(deadline);
      const locked      = next.status === "locked";
      const freeForAll  = new Date() >= freeForAllTime(next) && next.status !== "locked";
      const picks       = next.picks || {};
      const order       = pickOrder(data.players, data.races);
      const taken       = Object.values(picks);
      const available   = DRIVERS.filter(d => !taken.includes(d));
      const allPicked   = data.players.every(p => picks[p.id]);
      const myName      = data.players.find(p => p.id === who)?.name;

      // ── Second driver pick state ──────────────────────────────────────────────
      const picks2        = next.picks2 || {};
      const lockTime       = raceLockTime(next);
      const picksLocked    = new Date() >= lockTime;
      const windowStart    = secondPickStart(next);
      const windowOpen     = new Date() >= windowStart && !picksLocked;
      const everyoneTime   = secondPickEveryoneTime(next);
      const { bottomIds, staggered } = secondPickGroups(data.players, data.races);
      // Bottom group can finish early and unlock everyone else before the 6-hour
      // clock runs out. bottomIds.size > 0 guard prevents a vacuous "everyone in
      // bottomIds has picked" true when the tie rule collapsed the group to nobody.
      const bottomAllPicked = staggered && bottomIds.size > 0 && [...bottomIds].every(id => (next.picks2 || {})[id]);
      const everyoneIn     = !staggered || new Date() >= everyoneTime || bottomAllPicked;
      const taken2All      = [...taken, ...Object.values(picks2)];
      const available2     = DRIVERS.filter(d => !taken2All.includes(d));
      const eligibleFor2   = data.players.filter(p => !picks2[p.id] && (everyoneIn || bottomIds.has(p.id)));
      const allPicked2     = data.players.every(p => picks2[p.id]);
      const myName2        = data.players.find(p => p.id === who2)?.name;

      async function submit() {
        if (!who)       { setErr("Please select your name."); return; }
        if (!driver)    { setErr("Please select a driver."); return; }
        if (picks[who]) { setErr("You already locked in a pick!"); return; }
        if (!freeForAll) {
          const currentTurn = order.find(p => !picks[p.id]);
          if (currentTurn && currentTurn.id !== who) { setErr(`It's not your turn yet — waiting on ${currentTurn.name} to pick first.`); return; }
        }
        setSending(true);
        const newPicks = { ...picks, [who]: driver };
        const allDone  = data.players.every(p => newPicks[p.id]);
        const races    = data.races.map(r => r.id === next.id ? {
          ...r, picks: newPicks,
          ...(allDone && !r._allPickedAt ? { _allPickedAt: new Date().toISOString() } : {}),
        } : r);
        const newData  = { ...data, races };
        await update(newData);
        const nextPicker = order.find(p => !newPicks[p.id]);
        if (nextPicker) {
          const sent = await sendPickEmail({ toPlayer: nextPicker, nextRace: next, takenDrivers: Object.values(newPicks), allPlayers: data.players, allRaces: data.races });
          if (sent) showToast(`📧 Reminder sent to ${nextPicker.name}!`);
        }
        setSending(false);
        setDone(true);
        setErr("");
      }

      async function submit2() {
        if (!who2)        { setErr2("Please select your name."); return; }
        if (!driver2)     { setErr2("Please select a driver."); return; }
        if (picks2[who2]) { setErr2("You already locked in your 2nd driver!"); return; }
        if (!everyoneIn && !bottomIds.has(who2)) { setErr2("2nd driver picks are open to the bottom 3 in standings first."); return; }
        setSending2(true);
        const newPicks2 = { ...picks2, [who2]: driver2 };
        const races     = data.races.map(r => r.id === next.id ? { ...r, picks2: newPicks2 } : r);
        await update({ ...data, races });
        setSending2(false);
        setDone2(true);
        setErr2("");
      }

      return (
        <div className="anim">
          <div style={{ background:"linear-gradient(135deg, var(--head1) 0%, var(--head2) 100%)", border:`1px solid ${C.border}`, borderTop:`3px solid ${C.red}`, borderRadius:16, padding:20, marginBottom:14 }}>
            <div style={{ fontSize:40, marginBottom:5 }}>{next.flag}</div>
            <div style={{ fontFamily:"Syne,sans-serif", fontSize:20, textTransform:"uppercase", letterSpacing:".03em", marginBottom:4 }}>{next.name}</div>
            <div style={{ fontSize:12, color:C.dim, marginBottom:12 }}>{next.location} · {fmtDate(next.date)}</div>
            <div style={{ display:"flex", gap:7, flexWrap:"wrap" }}>
              {next.hasSprint && <Badge color={C.orange}>Sprint Weekend</Badge>}
              {locked ? <Badge color={C.red}>🔒 Picks Locked</Badge>
                : freeForAll ? <Badge color={C.orange}>⚡ Free-for-all — locks at qualifying!</Badge>
                : days <= 0 ? <Badge color={C.red}>Locks Today!</Badge>
                : next.hasSprint
                  ? <Badge color={C.green}>🟢 Open · Locks {days}d before sprint</Badge>
                  : <Badge color={C.green}>🟢 Open · {days}d to deadline</Badge>}
            </div>
          </div>

          <Card>
            <ST color={C.teal}>Pick Status</ST>
            {order.map((p,i) => {
              const hp     = !!picks[p.id];
              const isNext = !hp && order.findIndex(x => !picks[x.id]) === i;
              return (
                <div key={p.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 0", borderBottom:i<order.length-1?`1px solid ${C.border}`:"none" }}>
                  <div style={{ width:27, height:27, borderRadius:"50%", flexShrink:0, background:hp?"color-mix(in srgb, var(--green) 12%, transparent)":isNext?C.red:"var(--surface2)", border:`1px solid ${hp?"color-mix(in srgb, var(--green) 40%, transparent)":isNext?C.red:C.border}`, display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:700, fontFamily:"Syne,sans-serif", color:hp?C.green:isNext?"#fff":C.muted }}>
                    {hp ? "✓" : i+1}
                  </div>
                  <div style={{ flex:1, fontSize:14, fontWeight:600 }}>{p.name}</div>
                  <div style={{ fontSize:12 }}>
                    {hp
                      ? <span style={{ color:C.green, fontWeight:600 }}>{picks[p.id]}</span>
                      : isNext ? <span style={{ color:C.gold, fontWeight:600, animation:"pulse 2s infinite" }}>← Your turn</span>
                      : <span style={{ color:C.muted }}>Waiting...</span>}
                  </div>
                </div>
              );
            })}
            {allPicked && <div style={{ marginTop:10, padding:10, background:"color-mix(in srgb, var(--green) 8%, transparent)", border:`1px solid color-mix(in srgb, var(--green) 28%, transparent)`, borderRadius:8, fontSize:12, color:C.green, textAlign:"center" }}>All picks are in! 🎉</div>}
          </Card>

          {!locked && !done && !confirming && (
            <Card>
              <ST>Lock In Your Pick</ST>
              {err && <div style={{ color:C.red, fontSize:12, marginBottom:10 }}>{err}</div>}
              <div style={{ marginBottom:11 }}>
                {!freeForAll && (() => {
                  const turn = order.find(p => !picks[p.id]);
                  return turn ? (
                    <div style={{ padding:"10px 12px", background:"var(--surface2)", borderRadius:9, marginBottom:8 }}>
                      <div style={{ fontSize:10, color:C.dim, letterSpacing:".15em", textTransform:"uppercase", marginBottom:3 }}>It's their turn to pick</div>
                      <div style={{ fontSize:15, fontWeight:600, color:C.gold }}>{turn.name}</div>
                    </div>
                  ) : null;
                })()}
                {freeForAll && (
                  <div style={{ padding:"10px 12px", background:"color-mix(in srgb, var(--orange) 10%, transparent)", border:"1px solid color-mix(in srgb, var(--orange) 32%, transparent)", borderRadius:9, marginBottom:8 }}>
                    <div style={{ fontSize:10, color:C.orange, letterSpacing:".15em", textTransform:"uppercase", marginBottom:3 }}>⚡ Free-for-all — picks open to everyone</div>
                    <div style={{ fontSize:12, color:C.dim }}>Less than 24 hours to qualifying — anyone can pick now</div>
                  </div>
                )}
                <Sel value={who} onChange={e => setWho(e.target.value)}>
                  <option value="">{freeForAll ? "Select your name..." : `Confirm — are you ${order.find(p => !picks[p.id])?.name}?`}</option>
                  {freeForAll
                    ? data.players.filter(p => !picks[p.id]).map(p => <option key={p.id} value={p.id}>{p.name}</option>)
                    : (() => { const turn = order.find(p => !picks[p.id]); return turn ? [turn].map(p => <option key={p.id} value={p.id}>{p.name}</option>) : null; })()
                  }
                </Sel>
              </div>
              <div style={{ marginBottom:9 }}>
                <Lbl>Your Driver</Lbl>
                <Sel value={driver} onChange={e => setDriver(e.target.value)}>
                  <option value="">Select a driver...</option>
                  {available.map(d => (
                    <option key={d} value={d}>{d}{DRIVER_META[d]?.custom ? "  (stand-in)" : ""}</option>
                  ))}
                </Sel>
              </div>
              <AddDriverInline data={data} update={update} showToast={showToast} whoId={who}
                onAdded={n => setDriver(n)} />
              <Btn onClick={() => { if (!who) { setErr("Please select your name."); return; } if (!driver) { setErr("Please select a driver."); return; } setErr(""); setConfirming(true); }} disabled={sending}>Review My Pick →</Btn>
            </Card>
          )}

          {confirming && (
            <Card style={{ borderColor:"color-mix(in srgb, var(--gold) 32%, transparent)", background:"color-mix(in srgb, var(--gold) 8%, #fff)", textAlign:"center" }}>
              <div style={{ fontSize:36, marginBottom:12 }}>🏎</div>
              <div style={{ fontFamily:"Syne,sans-serif", fontSize:11, letterSpacing:".2em", textTransform:"uppercase", color:C.dim, marginBottom:16 }}>Confirm Your Pick</div>
              <div style={{ marginBottom:8 }}>
                <div style={{ fontSize:11, color:C.dim, marginBottom:3 }}>You are</div>
                <div style={{ fontFamily:"Syne,sans-serif", fontSize:22, color:C.gold }}>{data.players.find(p => p.id === who)?.name}</div>
              </div>
              <div style={{ fontSize:20, color:C.muted, marginBottom:8 }}>→</div>
              <div style={{ marginBottom:20 }}>
                <div style={{ fontSize:11, color:C.dim, marginBottom:3 }}>Picking driver</div>
                <div style={{ fontFamily:"Syne,sans-serif", fontSize:22, color:"var(--text)" }}>{driver}</div>
              </div>
              <div style={{ fontSize:11, color:C.dim, marginBottom:16 }}>for the {next.name}</div>
              <div style={{ display:"flex", gap:10, justifyContent:"center" }}>
                <Btn variant="ghost" onClick={() => setConfirming(false)}>← Go Back</Btn>
                <Btn onClick={submit} disabled={sending}>{sending ? "Saving..." : "✅ Confirm Pick"}</Btn>
              </div>
            </Card>
          )}

          {!confirming && locked && !allPicked && (
            <Card style={{ borderColor:"color-mix(in srgb, var(--danger) 28%, transparent)", background:"color-mix(in srgb, var(--danger) 6%, #fff)" }}>
              <div style={{ fontSize:13, color:C.dim, textAlign:"center" }}>🔒 Pick window is closed. Picks reveal after the race.</div>
            </Card>
          )}

          {done && (
            <Card style={{ borderColor:"color-mix(in srgb, var(--green) 35%, transparent)", background:"color-mix(in srgb, var(--green) 7%, #fff)", textAlign:"center" }}>
              <div style={{ fontSize:40, marginBottom:8 }}>✅</div>
              <div style={{ fontFamily:"Syne,sans-serif", fontSize:18, color:C.green, marginBottom:6 }}>Pick Locked!</div>
              <div style={{ fontSize:13, color:C.dim }}>Good luck, {myName}!</div>
            </Card>
          )}

          {/* ── Second Driver Pick ────────────────────────────────────────────── */}
          {windowOpen && (
            <Card style={{ borderTop:`3px solid ${C.gold}` }}>
              <ST color={C.gold}>🏎 2nd Driver Pick</ST>
              {!everyoneIn ? (
                <div style={{ marginBottom:12, padding:"8px 11px", background:"color-mix(in srgb, var(--gold) 10%, transparent)", border:"1px solid color-mix(in srgb, var(--gold) 28%, transparent)", borderRadius:8, fontSize:11, fontWeight:600, color:C.gold }}>
                  ⏳ Bottom 3 in standings get first access. Everyone else joins at {everyoneTime.toLocaleString("en-US",{ weekday:"short", hour:"numeric", minute:"2-digit" })} — or the moment all of them have picked, whichever comes first.

    // ── Calendar ─────────────────────────────────────────────────────────────────

    function CalendarTab({ data }) {
      const [openId, setOpenId] = useState(null);
      const upcoming  = data.races.filter(r => r.status !== "completed");
      const completed = data.races.filter(r => r.status === "completed");

      function StatusBadge({ race }) {

        if (race.status === "locked")     return <Badge color={C.red}>🔒 Locked</Badge>;
        const d = daysUntil(race.hasSprint ? keyDate(race) : race.date);
        if (d <= 14) return <Badge color={race.hasSprint ? C.orange : C.orange}>{d}d {race.hasSprint ? "to sprint" : "away"}</Badge>;
        return <span style={{ fontSize:11, color:C.dim }}>{fmtShort(race.hasSprint ? keyDate(race) : race.date)}</span>;
      }

      return (
        <div className="anim">
          <Card>
            <ST color={C.teal}>2026 Season · {upcoming.length} Races Remaining</ST>
            {upcoming.map((r,i) => (
              <div key={r.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 0", borderBottom:i<upcoming.length-1?`1px solid ${C.border}`:"none" }}>
                <div style={{ fontSize:20, flexShrink:0, width:28, textAlign:"center" }}>{r.flag}</div>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13, fontWeight:600 }}>{r.name}</div>
                  <div style={{ fontSize:11, color:C.dim }}>{r.location}</div>

          <Card>
            <ST>Completed Races</ST>
            {completed.map((r,i) => {
              const isOpen  = openId === r.id;
              const ranked  = r.noLeague ? null : [...data.players].map(p => {
                const pts  = r.points?.[p.id]||{s:0,r:0};
                const pts2 = r.points2?.[p.id]||{s:0,r:0};
                const driver2 = r.picks2?.[p.id];
                return {...p, s:pts.s||0, r:pts.r||0, s2:pts2.s||0, r2:pts2.r||0,
                  total:(pts.s||0)+(pts.r||0)+(driver2?(pts2.s||0)+(pts2.r||0):0),
                  driver:r.picks?.[p.id], driver2};
              }).sort((a,b) => b.total-a.total);
              const winner  = ranked?.[0];
              return (
                <div key={r.id} style={{ borderBottom:i<completed.length-1?`1px solid ${C.border}`:"none" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 0", cursor:ranked?"pointer":"default" }} onClick={() => ranked && setOpenId(isOpen ? null : r.id)}>
                    <div style={{ fontSize:22, flexShrink:0 }}>{r.flag}</div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontFamily:"Syne,sans-serif", fontSize:14, textTransform:"uppercase", letterSpacing:".03em" }}>{r.name}</div>
                      <div style={{ fontSize:11, color:C.dim }}>{fmtShort(r.date)}</div>
                    </div>
                    {winner && <div style={{ textAlign:"right", marginRight:6 }}>
                      <div style={{ fontSize:10, color:C.dim }}>Winner</div>
                      <div style={{ fontFamily:"Syne,sans-serif", fontSize:12, color:C.gold }}>{winner.name}</div>
                    </div>}
                    {r.noLeague && <span style={{ fontSize:11, color:C.muted }}>Pre-league</span>}
                    {ranked && <div style={{ color:C.dim, fontSize:12 }}>{isOpen ? "▲" : "▼"}</div>}
                  </div>
                  {isOpen && ranked && (
                    <div style={{ marginBottom:10 }}>
                      {ranked.map((p,j) => (
                        <div key={p.id} style={{ display:"flex", alignItems:"center", gap:9, padding:"7px 0", borderBottom:j<ranked.length-1?`1px solid ${C.border}`:"none" }}>
                          <div style={{ fontSize:j<3?15:11, width:20, textAlign:"center" }} className={j===0?"rg":j===1?"rs":j===2?"rb":""}>{j===0?"👑":j===1?"🥈":j===2?"🥉":`#${j+1}`}</div>
                          <div style={{ flex:1 }}>
                            <div style={{ fontSize:13, fontWeight:600 }}>{p.name}</div>
                            <div style={{ fontSize:11, color:C.dim }}>{p.driver || "—"}{p.driver2 && <span style={{ color:C.gold }}> + {p.driver2}</span>}</div>
                          </div>
                          <div style={{ textAlign:"right", fontSize:11, color:C.dim }}>
                            {r.hasSprint && <div>Sprint +{p.s}{p.driver2?`/+${p.s2}`:""}</div>}
                            <div>Race +{p.r}{p.driver2?`/+${p.r2}`:""}</div>
                          </div>
                          <div style={{ fontFamily:"Syne,sans-serif", fontSize:19, minWidth:34, textAlign:"right" }}>{p.total}</div>

                  )}
                </div>
              );
            })}
          </Card>
        </div>
      );
    }

    // ── Admin ─────────────────────────────────────────────────────────────────────

    function AdminTab({ data, update, showToast }) {
      const [pin, setPin]   = useState("");
      const [auth, setAuth] = useState(false);
      const [sec, setSec]   = useState("results");
      const [newPin, setNewPin] = useState("");
      const [raceId, setRaceId] = useState("");
      const [sprintOrd, setSprintOrd] = useState(Array(8).fill(""));
      const [raceOrd,   setRaceOrd]   = useState(Array(22).fill(""));
      const [emails, setEmails] = useState(() => { const e={}; data.players.forEach(p => { e[p.id]=p.email||""; }); return e; });
      const [preview, setPreview] = useState(null);
      const [drRaceId, setDrRaceId] = useState("");
      const [drText,   setDrText]   = useState("");
      const [importText, setImportText] = useState("");
      const [restoring,  setRestoring]  = useState(false);
      const [gName, setGName] = useState("");
      const [gTeam, setGTeam] = useState("");
      const [gErr,  setGErr]  = useState("");

      if (!auth) return (
        <div className="anim">
          <Card style={{ maxWidth:340, margin:"40px auto" }}>
            <div style={{ textAlign:"center", marginBottom:20 }}>
              <div style={{ fontSize:32, marginBottom:6 }}>⚙️</div>
              <div style={{ fontFamily:"Syne,sans-serif", fontSize:17, marginBottom:3 }}>Admin Panel</div>
              <div style={{ fontSize:12, color:C.dim }}>Commissioner access only</div>
            </div>
            <Lbl>PIN</Lbl>
            <Inp type="password" value={pin} onChange={e => setPin(e.target.value)} placeholder="Enter PIN" style={{ marginBottom:10 }}
              onKeyDown={e => e.key==="Enter" && (pin===data.adminPin ? setAuth(true) : showToast("Wrong PIN ❌"))} />
            <Btn onClick={() => pin===data.adminPin ? setAuth(true) : showToast("Wrong PIN ❌")} style={{ width:"100%", textAlign:"center" }}>Unlock</Btn>
            <div style={{ fontSize:10, color:C.muted, marginTop:10, textAlign:"center" }}>Default PIN: f1 — change it after first login</div>
          </Card>
        </div>
      );

      const upcoming   = data.races.filter(r => r.status !== "completed");
      // _restored marks a synthetic carry-forward block holding recovered points with
      // no underlying picks. Entering results against it would recompute from empty
      // picks and zero the totals, so it must never appear in the results selector.
      const completed  = data.races.filter(r => r.status === "completed" && !r.noLeague && !r._restored);
      const allRaces   = [...completed, ...upcoming];
      const selRace    = data.races.find(r => r.id === raceId);

      // Save sprint results only — stores sprint points, does NOT finalize the race
      function saveSprint() {
        if (!raceId || !selRace) { showToast("Select a race first"); return; }
        const pts  = { ...(selRace.points || {}) };
        const pts2 = { ...(selRace.points2 || {}) };
        data.players.forEach(p => {
          const drv  = selRace.picks?.[p.id];
          const drv2 = selRace.picks2?.[p.id];
          const existing  = pts[p.id]  || { s:0, r:0 };
          const existing2 = pts2[p.id] || { s:0, r:0 };
          let s = 0, s2 = 0;
          if (drv)  { const pos  = sprintOrd.indexOf(drv);  if (pos>=0  && pos<8)  s  = SPR_PTS[pos]; }
          if (drv2) { const pos2 = sprintOrd.indexOf(drv2); if (pos2>=0 && pos2<8) s2 = SPR_PTS[pos2]; }
          pts[p.id]  = { s, r: existing.r || 0 };
          pts2[p.id] = { s: s2, r: existing2.r || 0 };
        });
        // status stays as-is (picks_open/locked) — NOT completed. Points show but race not finalized.
        update({ ...data, races: data.races.map(r => r.id===raceId ? {
          ...r, points: pts, points2: pts2, _sprintSaved: true
        } : r) });
        showToast("Sprint results saved! Points showing — enter GP results to finalize 🏁");
      }

      // Save GP results and finalize the race — calculates full points, marks complete
      // Drivers still selectable for slot i: everyone not already placed in some
      // OTHER slot. The current slot's own value stays listed so it renders as the
      // selected option and can be re-picked without clearing it first.
      function availableFor(ord, i) {
        const used = new Set(ord.filter((d, j) => d && j !== i));
        return ROSTER_2026.filter(d => !used.has(d));
      }

      function saveResults() {
        if (!raceId || !selRace) { showToast("Select a race first"); return; }
        const pts  = {};
        const pts2 = {};
        // Safety net: if sprint results were already saved but the sprint-order form
        // is completely blank, the admin is only entering the GP — keep the stored
        // sprint points rather than recomputing them to zero.
        const sprintFormBlank = selRace.hasSprint && selRace._sprintSaved && sprintOrd.every(d => !d);
        data.players.forEach(p => {
          const drv  = selRace.picks?.[p.id];
          const drv2 = selRace.picks2?.[p.id];
          if (!drv) { pts[p.id]={s:0,r:0}; } else {
            let s = 0;
            if (selRace.hasSprint) {
              if (sprintFormBlank) { s = selRace.points?.[p.id]?.s || 0; }
              else { const pos=sprintOrd.indexOf(drv); if(pos>=0&&pos<8) s=SPR_PTS[pos]; }
            }
            const rpos = raceOrd.indexOf(drv);
            const r = (rpos>=0&&rpos<10) ? GP_PTS[rpos] : 0;
            pts[p.id] = {s, r};
          }
          if (!drv2) { pts2[p.id]={s:0,r:0}; } else {
            let s2 = 0;
            if (selRace.hasSprint) {
              if (sprintFormBlank) { s2 = selRace.points2?.[p.id]?.s || 0; }
              else { const pos2=sprintOrd.indexOf(drv2); if(pos2>=0&&pos2<8) s2=SPR_PTS[pos2]; }
            }
            const rpos2 = raceOrd.indexOf(drv2);
            const r2 = (rpos2>=0&&rpos2<10) ? GP_PTS[rpos2] : 0;
            pts2[p.id] = {s:s2, r:r2};
          }
        });
        const isAlreadyCompleted = selRace.status === "completed";

        // One entry, both outcomes. The full order is stored on the race as the
        // source of truth (so reopening doesn't have to reverse-engineer it from
        // points), and the same order populates the research chart.
        const gpOrder = [...raceOrd];
        const placed  = gpOrder.filter(Boolean).length;
        const nextDriverResults = { ...(data.driverResults || SEED_DRIVER_RESULTS) };
        if (placed > 0) {
          const map = {};
          gpOrder.forEach((d, i) => { if (d) map[d] = i + 1; });
          nextDriverResults[raceId] = map;
        }

        update({
          ...data,
          driverResults: nextDriverResults,
          races: data.races.map(r => r.id===raceId ? {
            ...r,
            status: "completed",
            points: pts,
            points2: pts2,
            gpOrder,
            _sprintSaved: false,
            ...(isAlreadyCompleted ? { _pointsEdited: true } : {})
          } : r)
        });
        showToast(placed > 0
          ? `Race finalized · ${placed} finishers charted ✅`
          : "Race finalized & points saved ✅");
        setRaceId(""); setSprintOrd(Array(8).fill("")); setRaceOrd(Array(22).fill(""));
      }

      // Clear a race's results/points but KEEP everyone's picks
      function clearResults() {
        if (!raceId || !selRace) { showToast("Select a race first"); return; }
        const msg = `Clear all results for ${selRace.name}?\n\nThis wipes the points and moves it back to open picking, but KEEPS everyone's driver picks. Standings and pick order will recalculate.\n\nThe Driver Research chart entry for this race is kept — remove it separately under Driver Data if you want it gone too.`;
        if (!window.confirm(msg)) return;
        update({ ...data, races: data.races.map(r => r.id===raceId ? {
          ...r,
          points: {},
          points2: {},
          gpOrder: [],
          status: "picks_open",
          _sprintSaved: false,
          _pointsEdited: false,
        } : r) });
        showToast("Results cleared — picks kept ✅");
        setSprintOrd(Array(8).fill("")); setRaceOrd(Array(22).fill(""));
      }

      function saveEmails() {
        const players = data.players.map(p => ({...p, email: emails[p.id]||""}));
        update({ ...data, players });
        showToast("Emails saved ✅");
      }

      async function sendTest(player) {
        showToast("Sending test email...");
        const sent = await sendPickEmail({ toPlayer:{...player, email:emails[player.id]}, nextRace:upcoming[0]||data.races[0], takenDrivers:[], allPlayers:data.players, allRaces:data.races });
        showToast(sent ? `Test sent to ${player.name} ✅` : "Send failed — check EmailJS config ❌");
      }

      function previewEmail(player) {
        const next  = upcoming[0];
        const picks = next?.picks || {};
        const order = pickOrder(data.players, data.races);
        const pos   = order.findIndex(p => p.id === player.id) + 1;
        setPreview({
          to: emails[player.id] || "(no email set)",
          subject: `F1 Fantasy — Your turn to pick! 🏎 ${next?.name||""}`,
          body: `Hey ${player.name}!\n\nIt's your turn to pick for the ${next?.name||"upcoming race"} on ${fmtShort(next?.date||"")}.\n\nYou are pick #${pos} in the order.\n\nDrivers already taken: ${Object.values(picks).join(", ")||"None — you're first!"}\n\nLock in your pick before the deadline:\n→ ${window.location.href}\n\nGood luck! 🏎\n— F1 Fantasy League`,
        });
      }

      // ── Driver research results (full 22-car finishing order) ──────────────────
      // Parsed from a pasted finishing order, one driver per line, P1 first.
      // Leading numbering ("1." / "1)") is stripped; last-name-only lines work too.
      const drParsed = drText
        .split("\n")
        .map(l => l.trim())
        .filter(Boolean)
        .map((line, i) => ({ line, pos: i + 1, driver: matchDriver(line) }));
      const drMatched   = drParsed.filter(p => p.driver);
      const drUnmatched = drParsed.filter(p => !p.driver);
      const drDupes     = drMatched
        .map(p => p.driver)
        .filter((d, i, a) => a.indexOf(d) !== i)
        .filter((d, i, a) => a.indexOf(d) === i);

      // The chart falls back to SEED_DRIVER_RESULTS while no driverResults field
      // exists. Edits must therefore build on the seed, not on {} — otherwise the
      // first race saved becomes the ONLY race and the 11 pre-loaded ones vanish.
      const drBase = data.driverResults || SEED_DRIVER_RESULTS;

      function saveDriverResults() {
        if (!drRaceId) { showToast("Select a race first"); return; }
        if (!drMatched.length) { showToast("Nothing to save — paste a finishing order"); return; }
        if (drDupes.length) { showToast(`Duplicate driver: ${drDupes[0]} ❌`); return; }
        const map = {};
        drMatched.forEach(p => { map[p.driver] = p.pos; });
        update({ ...data, driverResults: { ...drBase, [drRaceId]: map } });
        showToast(`Saved ${drMatched.length} finishers 🔬`);
        setDrText("");
      }

      function clearDriverResults() {
        if (!drRaceId) { showToast("Select a race first"); return; }
        const r = data.races.find(x => x.id === drRaceId);
        if (!window.confirm(`Remove research data for ${r?.name||drRaceId}?\n\nThis only affects the Driver Research chart — league picks and points are untouched.`)) return;
        const dr = { ...drBase };
        delete dr[drRaceId];
        update({ ...data, driverResults: dr });
        showToast("Research data cleared ✅");
        setDrText("");
      }

      // ── Backup / restore ──────────────────────────────────────────────────────
      function exportBackup() {
        const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,"-");
        const blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `f1-fantasy-backup-${stamp}.json`;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        showToast("Backup downloaded 💾");
      }

      async function importBackup() {
        let parsed;
        try { parsed = JSON.parse(importText); }
        catch(e) { showToast("That isn't valid JSON ❌"); return; }
        if (!parsed || !Array.isArray(parsed.races) || !Array.isArray(parsed.players)) {
          showToast("Missing players/races — not a league backup ❌"); return;
        }
        const msg = `Overwrite the league with this backup?\n\n`
          + `Players: ${parsed.players.length}\n`
          + `Races: ${parsed.races.length}\n`
          + `Completed: ${parsed.races.filter(r => r.status==="completed").length}\n\n`
          + `This replaces everything currently stored. Export a backup first if you haven't.`;
        if (!window.confirm(msg)) return;
        setRestoring(true);
        try {
          await forceWriteData(parsed);
          showToast("League restored ✅ — reloading");
          setTimeout(() => window.location.reload(), 900);
        } catch(e) {
          console.error(e);
          showToast("Restore failed — see console ❌");
          setRestoring(false);
        }
      }

      const SECS = [["results","📊 Results"],["races","🏁 Races"],["picks","✏️ Edit Picks"],["grid","🏎 Grid"],["driverdata","🔬 Driver Data"],["backup","💾 Backup"],["emails","📧 Emails"],["settings","⚙️ Settings"]];

      return (
        <div className="anim">
          <div style={{ display:"flex", gap:6, marginBottom:14, flexWrap:"wrap" }}>
            {SECS.map(([id,lbl]) => (

                  const sO = Array(8).fill("");
                  let   rO = Array(22).fill("");

                  // Sprint order still has to be reconstructed from points — it isn't
                  // stored anywhere. Walk BOTH picks and picks2: a slot filled only by
                  // someone's second driver would otherwise come back blank, and
                  // re-saving would silently zero that driver's points.
                  const rebuildSprint = (picksMap, pointsMap) => {
                    if (!picksMap || !pointsMap) return;
                    Object.entries(picksMap).forEach(([pid, drv]) => {
                      const pt = pointsMap[pid];
                      if (pt?.s > 0) { const idx = SPR_PTS.indexOf(pt.s); if (idx >= 0 && !sO[idx]) sO[idx] = drv; }
                    });
                  };
                  rebuildSprint(r?.picks,  r?.points);
                  rebuildSprint(r?.picks2, r?.points2);

                  //  1. r.gpOrder — the actual order that was entered. Source of truth.
                  //  2. driverResults — full field, entered via the research paste box.
                  //  3. Legacy: reverse-engineer the top 10 from saved points. Only
                  //     recovers positions held by someone's pick; everything else
                  //     comes back blank, which is why 1 and 2 are preferred.
                  if (Array.isArray(r?.gpOrder) && r.gpOrder.length) {
                    rO = Array(22).fill("").map((_, i) => r.gpOrder[i] || "");

                    Object.entries(data.driverResults[r.id]).forEach(([drv, pos]) => {

                      if (!picksMap || !pointsMap) return;
                      Object.entries(picksMap).forEach(([pid, drv]) => {
                        const pt = pointsMap[pid];
                        if (pt?.r > 0) { const idx = GP_PTS.indexOf(pt.r); if (idx >= 0 && !rO[idx]) rO[idx] = drv; }
                      });
                    };
                    rebuildGp(r?.picks,  r?.points);
                    rebuildGp(r?.picks2, r?.points2);

    // ── Chat Firebase ───────────────────────────────────────────────────────────

    async function postMessage(playerId, playerName, text) {
      if (!db) return;
      try {
        await db.collection("f1fantasy-chat").add({
          playerId, playerName, text,
          ts: firebase.firestore.FieldValue.serverTimestamp(),
        });
      } catch(e) { console.error("Chat error:", e); }
    }

    function subscribeChat(callback) {
      if (!db) return () => {};
      return db.collection("f1fantasy-chat")
        .orderBy("ts", "asc")
        .limitToLast(100)
        .onSnapshot(snap => callback(snap.docs.map(d => ({ id:d.id, ...d.data() }))));
    }

    // ── Chat Tab ─────────────────────────────────────────────────────────────────

    function ChatTab({ players }) {
      const [msgs,    setMsgs]    = useState([]);
      const [who,     setWho]     = useState("");
      const [text,    setText]    = useState("");
      const [sending, setSending] = useState(false);
      const bottomRef = useRef(null);

      useEffect(() => {
        const unsub = subscribeChat(setMsgs);
        return () => unsub();
      }, []);

      useEffect(() => {
        bottomRef.current && bottomRef.current.scrollIntoView({ behavior:"smooth" });
      }, [msgs]);

      async function send() {

        await postMessage(who, name, text.trim());
        setText("");
        setSending(false);

      function fmtTs(ts) {

      const PC = { lewis:"var(--teal)", zayd:"var(--orange)", toth:"var(--accent)", mcmichael:"var(--gold)", hattner:"#7A3FD1", yogesh:"var(--green)" };

                  <div key={m.id} style={{ display:"flex", flexDirection:"column", gap:3 }}>

    // ── Driver Research ───────────────────────────────────────────────────────────

    function ResearchTab({ data }) {
      const [hidden, setHidden] = useState(() => new Set());
      const [focus,  setFocus]  = useState(null);   // driver name pinned by click
      const [hover,  setHover]  = useState(null);

      const results = data.driverResults || SEED_DRIVER_RESULTS;
      // Races that have data, in official calendar order
      const cols = data.races.filter(r => results[r.id] && Object.keys(results[r.id]).length);

      if (!cols.length) return (
        <div className="anim">
          <Card>
            <ST>🔬 Driver Research</ST>
            <div style={{ fontSize:13, color:C.dim, lineHeight:1.7 }}>
              No race results entered yet. Add them under <strong>Admin → Driver Data</strong> and every
              driver's season will chart itself here.
            </div>
          </Card>
        </div>
      );

      const short = r => (r.id.split("-")[0] || "").toUpperCase();

      // ── Geometry ──
      const W = 780, padL = 30, padR = 14, padT = 14, padB = 30;
      const rowH = 22, H = padT + padB + rowH * 21;
      const plotW = W - padL - padR;
      const xAt = i => cols.length === 1 ? padL + plotW/2 : padL + (i * plotW) / (cols.length - 1);
      const yAt = p => padT + (p - 1) * rowH;

      const visible = ROSTER_2026.filter(d => !hidden.has(DRIVER_META[d].team));

      function toggleTeam(t) {
        setHidden(prev => {
          const n = new Set(prev);
          n.has(t) ? n.delete(t) : n.add(t);
          return n;
        });
      }
      const showAll  = () => setHidden(new Set());
      const hideAll  = () => setHidden(new Set(F1_TEAMS_2026.map(t => t.name)));

      // Build contiguous segments so a DNF leaves a visible gap in the line
      function segmentsFor(driver) {
        const segs = []; let cur = [];
        cols.forEach((r, i) => {
          const pos = results[r.id][driver];
          if (pos) cur.push({ x: xAt(i), y: yAt(pos), pos, race: r });
          else { if (cur.length) segs.push(cur); cur = []; }
        });
        if (cur.length) segs.push(cur);
        return segs;
      }

      // Season summary for the legend: best finish + races finished
      function summary(driver) {
        const all = cols.map(r => results[r.id][driver]).filter(Boolean);
        return { best: all.length ? Math.min(...all) : null, fin: all.length, of: cols.length };
      }

      return (
        <div className="anim">
          <Card>
            <ST>🔬 Driver Research</ST>
            <div style={{ fontSize:12, color:C.dim, lineHeight:1.7, marginBottom:12 }}>
              Every driver's finishing position, race by race. Lines climb toward the top as a driver
              finishes higher. A break in a line is a DNF or a race they didn't start.
              Tap a team to hide it, tap a driver to isolate them.
            </div>

            <div style={{ display:"flex", gap:6, marginBottom:10 }}>
              <Btn variant="ghost" onClick={showAll} style={{ padding:"6px 10px", fontSize:10 }}>All teams</Btn>
              <Btn variant="ghost" onClick={hideAll} style={{ padding:"6px 10px", fontSize:10 }}>Clear</Btn>
              {focus && <Btn variant="ghost" onClick={() => setFocus(null)} style={{ padding:"6px 10px", fontSize:10 }}>Unpin {focus.split(" ").slice(-1)[0]}</Btn>}
            </div>

            <div style={{ display:"flex", flexWrap:"wrap", gap:5, marginBottom:14 }}>
              {F1_TEAMS_2026.map(t => {
                const off = hidden.has(t.name);
                return (
                  <button key={t.name} className="bp" onClick={() => toggleTeam(t.name)}
                    style={{ display:"flex", alignItems:"center", gap:5, padding:"5px 9px", borderRadius:20,
                      border:`1px solid ${C.border}`, background:off ? "transparent" : "var(--field)",
                      opacity: off ? .42 : 1, cursor:"pointer", fontFamily:"DM Sans,sans-serif",
                      fontSize:10, fontWeight:600, letterSpacing:".04em", color:"var(--text)" }}>
                    <span style={{ width:8, height:8, borderRadius:"50%", background:t.c1 }} />
                    <span style={{ width:8, height:8, borderRadius:"50%", background:t.c2, marginLeft:-3 }} />
                    {t.name}
                  </button>
                );
              })}
            </div>

            {/* ── Chart ── */}
            <div style={{ overflowX:"auto", position:"relative" }}>
              <div style={{ position:"relative", minWidth:640 }}>
                <svg viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", display:"block" }}>
                  {/* position gridlines */}
                  {Array.from({length:22}, (_,k) => k+1).map(p => (
                    <g key={p}>
                      <line x1={padL} y1={yAt(p)} x2={W-padR} y2={yAt(p)}
                        stroke="var(--border)" strokeWidth={p===1?1.2:0.6} opacity={p%5===1?0.9:0.45} />
                      <text x={padL-7} y={yAt(p)+3.5} textAnchor="end"
                        style={{ fontSize:9, fill:"var(--muted)", fontFamily:"DM Sans,sans-serif" }}>{p}</text>
                    </g>
                  ))}
                  {/* race column markers */}
                  {cols.map((r,i) => (
                    <g key={r.id}>
                      <line x1={xAt(i)} y1={padT} x2={xAt(i)} y2={H-padB} stroke="var(--border)" strokeWidth={0.6} opacity={0.5} />
                      <text x={xAt(i)} y={H-padB+15} textAnchor="middle"
                        style={{ fontSize:10, fontWeight:600, fill:"var(--dim)", fontFamily:"DM Sans,sans-serif" }}>{short(r)}</text>
                    </g>
                  ))}
                  {/* driver traces */}
                  {visible.map(d => {
                    const meta = DRIVER_META[d];
                    const dim  = focus && focus !== d;
                    return (
                      <g key={d} opacity={dim ? 0.12 : 1} style={{ transition:"opacity .15s" }}>
                        {segmentsFor(d).map((seg,si) => (
                          <polyline key={si} fill="none" stroke={meta.color}
                            strokeWidth={focus === d ? 3.4 : 2}
                            strokeLinejoin="round" strokeLinecap="round"
                            points={seg.map(pt => `${pt.x},${pt.y}`).join(" ")} />
                        ))}
                        {segmentsFor(d).flat().map((pt,pi) => (
                          <circle key={pi} cx={pt.x} cy={pt.y} r={focus === d ? 5 : 3.4}
                            fill={meta.color} stroke="var(--card)" strokeWidth={1.2}
                            style={{ cursor:"pointer" }}
                            onMouseEnter={() => setHover({ d, pos:pt.pos, race:pt.race, x:pt.x, y:pt.y })}
                            onMouseLeave={() => setHover(null)}
                            onClick={() => setFocus(f => f === d ? null : d)} />
                        ))}
                      </g>
                    );
                  })}
                </svg>
                {hover && (
                  <div style={{ position:"absolute", left:`${(hover.x/W)*100}%`, top:`${(hover.y/H)*100}%`,
                    transform:"translate(-50%, -125%)", pointerEvents:"none", zIndex:5,
                    background:"var(--card)", border:`1px solid ${C.border2 || C.border}`, borderRadius:9,
                    padding:"7px 10px", boxShadow:"0 8px 22px rgba(0,0,0,.16)", whiteSpace:"nowrap" }}>
                    <div style={{ fontFamily:"Syne,sans-serif", fontWeight:700, fontSize:12, color:DRIVER_META[hover.d].color }}>{hover.d}</div>
                    <div style={{ fontSize:11, color:"var(--text)", fontWeight:600 }}>P{hover.pos} · {hover.race.flag} {hover.race.location}</div>
                    <div style={{ fontSize:10, color:C.muted }}>{DRIVER_META[hover.d].team}</div>
                  </div>
                )}
              </div>
            </div>
          </Card>

          {/* ── Driver legend / season summary ── */}
          <Card>
            <ST color={C.teal}>Drivers — {cols.length} race{cols.length===1?"":"s"} on record</ST>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(168px, 1fr))", gap:4 }}>
              {ROSTER_2026.map(d => {
                const meta = DRIVER_META[d];
                const off  = hidden.has(meta.team);
                const s    = summary(d);
                return (
                  <button key={d} className="bp" onClick={() => setFocus(f => f === d ? null : d)}
                    style={{ display:"flex", alignItems:"center", gap:8, padding:"7px 9px", borderRadius:9,
                      border:`1px solid ${focus===d ? meta.color : "transparent"}`,
                      background: focus===d ? "color-mix(in srgb, var(--accent) 7%, transparent)" : "transparent",
                      opacity: off ? .35 : 1, cursor:"pointer", textAlign:"left", width:"100%" }}>
                    <span style={{ width:11, height:3, borderRadius:2, background:meta.color, flexShrink:0 }} />
                    <span style={{ flex:1, minWidth:0 }}>
                      <span style={{ display:"block", fontSize:12.5, fontWeight:600, color:"var(--text)", overflow:"hidden", textOverflow:"ellipsis" }}>{d}</span>
                      <span style={{ display:"block", fontSize:9.5, color:C.muted }}>
                        {s.best ? `Best P${s.best} · ${s.fin}/${s.of} finished` : "No finishes"}
                      </span>
                    </span>
                  </button>
                );
              })}
            </div>
          </Card>
        </div>
      );
    }

    // ── Root ──────────────────────────────────────────────────────────────────────

    function App() {
      const [data,      setData]      = useState(null);
      const [tab,       setTab]       = useState("standings");
      const [team,      setTeam]      = useState(() => nextTeam(null));
      const [loaded,    setLoaded]    = useState(false);
      const [toast,     setToast]     = useState("");
      const [latestMsg, setLatestMsg] = useState(null);
      const [menuOpen,  setMenuOpen]  = useState(false);
      const [dbOk,      setDbOk]      = useState(true);
      const toastTimer = useRef(null);
      const bottomEmailFiredRef   = useRef(null);
      const everyoneEmailFiredRef = useRef(null);

      useEffect(() => {
        emailjs.init(EMAILJS_PUBLIC_KEY);
        loadData().then(d => { setData(d); setDbOk(dataIsOk()); setLoaded(true); });
        const unsub = subscribeData(d => setData(d));
        const unsubChat = subscribeChat(msgs => setLatestMsg(msgs.length ? msgs[msgs.length-1] : null));
        return () => { unsub(); unsubChat(); };
      }, []);

      // Rotating team palette: applied on load, re-rolled on every tab switch.
      // nextTeam() never returns the palette that's currently showing, so each
      // change is visible.
      useEffect(() => { applyTeam(team.id); }, [team]);

      function changeTab(id) {
        if (id !== tab) setTeam(t => nextTeam(t.id));
        setTab(id);
        setMenuOpen(false);
      }

      useEffect(() => {
        if (!menuOpen) return;
        const onKey = e => { if (e.key === "Escape") setMenuOpen(false); };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [menuOpen]);

      const update = useCallback(async (newData) => {
        setData(newData);
        await saveData(newData);
      }, []);

      // Second-pick reminder emails — TWO separate moments, deliberately mirroring
      // the exact eligibility check the pick screen itself uses (line ~946:
      // everyoneIn || bottomIds.has(p.id)). Previously this was a single trigger
      // keyed only on "has the window opened at all", which emailed every player
      // the moment the bottom group's early window opened — including players who
      // the pick screen correctly still locked out. Splitting it in two closes
      // that mismatch structurally instead of patching the symptom.
      //
      // Non-staggered races (first two of the season) have no bottom group —
      // secondPickGroups returns an empty bottomIds — so everyoneIn is true from
      // the moment the window opens and this collapses to one email, one flag,
      // sent to everyone, same as before the split.
      useEffect(() => {
        if (!data) return;
        if (!dataIsOk()) return;
        const next = data.races.find(r => r.status !== "completed");
        if (!next) return;
        if (new Date(next.date + "T23:59:59") < new Date()) return;
        if (EMAILJS_PUBLIC_KEY === "PASTE_YOUR_EMAILJS_PUBLIC_KEY_HERE") return;

        const { bottomIds, staggered } = secondPickGroups(data.players, data.races);
        const windowStart     = secondPickStart(next);
        const everyoneTime    = secondPickEveryoneTime(next);
        const bottomAllPicked = staggered && bottomIds.size > 0 && [...bottomIds].every(id => (next.picks2 || {})[id]);
        const everyoneIn      = !staggered || new Date() >= everyoneTime || bottomAllPicked;

        const bottomDue   = new Date() >= windowStart && !next._bottomPickEmailSent
                             && bottomEmailFiredRef.current !== next.id;
        const everyoneDue = staggered && everyoneIn && !next._everyonePickEmailSent
                             && everyoneEmailFiredRef.current !== next.id;
        if (!bottomDue && !everyoneDue) return;

        (async () => {
          if (bottomDue) {
            bottomEmailFiredRef.current = next.id;
            const recipients = staggered ? data.players.filter(p => bottomIds.has(p.id)) : data.players;
            const flagPatch = staggered ? { _bottomPickEmailSent: true } : { _bottomPickEmailSent: true, _everyonePickEmailSent: true };
            const races = data.races.map(r => r.id === next.id ? { ...r, ...flagPatch } : r);
            await saveData({ ...data, races });
            await sendSecondPickEmails(recipients, next);
          }
          if (everyoneDue) {
            everyoneEmailFiredRef.current = next.id;
            const recipients = data.players.filter(p => !bottomIds.has(p.id));
            const races = data.races.map(r => r.id === next.id ? { ...r, _everyonePickEmailSent: true } : r);
            await saveData({ ...data, races });
            await sendSecondPickEmails(recipients, next);
          }
        })();
      }, [data]);

      async function sendSecondPickEmails(recipients, next) {
        for (const p of recipients) {
          if (!p.email) continue;
          try {
            await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
              to_email: p.email,
              to_name: p.name,
              race_name: next.name,
              race_date: fmtShort(next.date),
              pick_pos: "2nd driver window open",
              taken: Object.values(next.picks2||{}).join(", ") || "None yet",
              app_url: window.location.href,
            }, EMAILJS_PUBLIC_KEY);
          } catch(e) { console.error("2nd-pick email error:", e); }
        }
      }

      function showToast(msg) {
        setToast(msg);
        if (toastTimer.current) clearTimeout(toastTimer.current);
        toastTimer.current = setTimeout(() => setToast(""), 3500);
      }

      // Sync the roster registries with league state. Deliberately done here in the
      // render body, not in an effect: children render after App returns, so they
      // always see the current roster. rebuildRoster() is idempotent and no-ops
      // when nothing changed, so calling it every render is cheap and safe.
      rebuildRoster(data && data.customDrivers, data && data.inactiveDrivers);

      if (!loaded) return (
        <div style={{ minHeight:"100vh", background:C.bg, display:"flex", alignItems:"center", justifyContent:"center" }}>
          <div style={{ fontFamily:"Syne,sans-serif", fontWeight:800, fontSize:24, color:C.red, letterSpacing:".2em" }}>LOADING...</div>
        </div>
      );

      const TABS = [["standings","🏆","Standings"],["race","🏁","Pick Driver"],["calendar","📅","Calendar"],["research","🔬","Driver Research"],["chat","💬","Chat"],["admin","⚙️","Admin"]];

      return (
        <>
          {toast && (
            <div style={{ position:"fixed", top:14, right:14, zIndex:999, background:"var(--surface2)", border:`1px solid ${C.border}`, borderRadius:10, padding:"10px 15px", fontFamily:"DM Sans,sans-serif", fontSize:13, color:"var(--text)", boxShadow:"0 8px 28px rgba(0,0,0,.18)", maxWidth:270 }}>
              {toast}
            </div>
          )}
          <div style={{ minHeight:"100vh", background:C.bg, color:"var(--text)" }}>
            {!dbOk && (
              <div style={{ background:"color-mix(in srgb, var(--danger) 12%, #fff)", borderBottom:`2px solid ${C.danger}`, padding:"10px 16px", position:"sticky", top:0, zIndex:120 }}>
                <div style={{ maxWidth:680, margin:"0 auto", fontSize:12.5, color:C.danger, fontWeight:600, lineHeight:1.55 }}>
                  ⚠ Read-only — not connected to your league data. Showing placeholder values, and
                  nothing you do here will be saved. Don't enter picks or results until this clears.
                </div>
              </div>
            )}
            <div style={{ background:"color-mix(in srgb, var(--card) 92%, transparent)", backdropFilter:"blur(20px)", borderBottom:`1px solid ${C.border}`, padding:"0 16px", position:"sticky", top:0, zIndex:100 }}>
              <div style={{ maxWidth:680, margin:"0 auto", display:"flex", alignItems:"center", justifyContent:"space-between", height:56 }}>
                <div style={{ display:"flex", alignItems:"baseline", gap:9 }}>
                  <span style={{ fontFamily:"Syne,sans-serif", fontWeight:800, fontSize:21, color:C.red, letterSpacing:"-.02em" }}>F1</span>
                  <span style={{ fontFamily:"Syne,sans-serif", fontWeight:700, fontSize:17, letterSpacing:"-.01em" }}>FANTASY</span>
                  <span style={{ fontFamily:"DM Sans,sans-serif", fontSize:10, color:C.dim, fontWeight:400, letterSpacing:".12em", textTransform:"uppercase" }}>2026</span>
                  <span style={{ fontFamily:"DM Sans,sans-serif", fontSize:9, color:C.red, fontWeight:600, letterSpacing:".14em", textTransform:"uppercase", paddingLeft:2 }}>{team.name}</span>
                </div>
                <div style={{ position:"relative" }}>
                  <button
                    className={`menu-btn${menuOpen ? " open" : ""}`}
                    onClick={() => setMenuOpen(o => !o)}
                    aria-label="Open menu"
                    aria-expanded={menuOpen}
                  >
                    <span></span><span></span><span></span>
                  </button>
                  {menuOpen && (
                    <>
                      <div className="menu-overlay" onClick={() => setMenuOpen(false)} />
                      <div className="menu-panel">
                        {TABS.map(([id,icon,label]) => (
                          <button
                            key={id}
                            className={`menu-item${tab===id ? " active" : ""}`}
                            onClick={() => changeTab(id)}
                          >
                            <span className="ico">{icon}</span>{label}
                          </button>
                        ))}
                      </div>
                    </>
                  )}
                </div>
              </div>
            </div>
            <div style={{ maxWidth:680, margin:"0 auto", padding:"18px 14px 60px" }}>
              {tab==="standings" && <StandingsTab data={data} latestMsg={latestMsg} setTab={changeTab} />}
              {tab==="race"      && <RaceTab      data={data} update={update} showToast={showToast} />}
              {tab==="calendar"  && <CalendarTab  data={data} />}
              {tab==="research"  && <ResearchTab  data={data} />}
              {tab==="chat"      && <ChatTab      players={data.players} />}
              {tab==="admin"     && <AdminTab     data={data} update={update} showToast={showToast} />}
            </div>
          </div>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
